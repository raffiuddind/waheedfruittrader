version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: waheed-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: waheed_fruit_trader
      MYSQL_USER: waheed_user
      MYSQL_PASSWORD: waheed_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: waheed-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: waheed-app
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      DB_USERNAME: waheed_user
      DB_PASSWORD: waheed_pass
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/waheed_fruit_trader?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: waheedfruittrader_jwt_secret_key_2024_very_long_secret_string
      SPRING_PROFILES_ACTIVE: prod

volumes:
  mysql-data:
  redis-data:
