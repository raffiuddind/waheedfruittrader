spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
    username: sa
    password:
    driver-class-name: org.h2.Driver

  flyway:
    enabled: false

  data:
    redis:
      host: localhost
      port: 6379

mybatis:
  mapper-locations: classpath:mybatis/mapper/*.xml
  type-aliases-package: com.waheedfruittrader.model.entity
  configuration:
    map-underscore-to-camel-case: true

app:
  jwt:
    secret: test_jwt_secret_key_for_testing_only_32_chars_minimum
    expiration: 86400000

whatsapp:
  enabled: false
