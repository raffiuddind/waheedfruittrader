spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5

logging:
  level:
    com.waheedfruittrader: WARN
    org.mybatis: WARN
  file:
    name: /var/log/waheedfruittrader/app.log

server:
  error:
    include-stacktrace: never
